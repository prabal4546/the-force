name: CI

on:
  push:
  pull_request:

jobs:
  repository-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'services/mac-runtime[dev]'
      - run: make check
