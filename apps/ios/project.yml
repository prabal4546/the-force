name: BodyOS

options:
  bundleIdPrefix: com.bodyos.demo
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  BodyOS:
    type: application
    platform: iOS
    info:
      path: BodyOSApp/Info.plist
      properties:
        CFBundleDisplayName: BodyOS
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "BodyOS connects to Mentra Live smart glasses."
        NSCameraUsageDescription: "BodyOS uses camera frames to identify and follow the selected demo target."
        NSLocalNetworkUsageDescription: "BodyOS exchanges demo events and photos with devices on the private local network."
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: BodyOSApp
      - path: Modules
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bodyos.demo.app
        PRODUCT_NAME: BodyOS
    scheme:
      testTargets:
        - BodyOSTests

  BodyOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BodyOS
